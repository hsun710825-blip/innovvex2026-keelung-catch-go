<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnoVEX 2026 攤位 QR Code 列印版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
      color: #111;
    }
    h1 {
      text-align: center;
      font-size: 1.25rem;
      color: #1A3E95;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 2px solid #1A3E95;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      page-break-inside: avoid;
    }
    .card__num {
      font-size: 0.75rem;
      font-weight: 700;
      color: #D20A11;
    }
    .card__name {
      font-size: 1rem;
      font-weight: 800;
      margin: 0.25rem 0 0.75rem;
      color: #1A3E95;
    }
    .card img {
      width: 160px;
      height: 160px;
      display: block;
      margin: 0 auto 0.5rem;
    }
    .card__url {
      font-size: 0.55rem;
      word-break: break-all;
      color: #666;
      line-height: 1.35;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none; }
      .grid { gap: 0.5rem; }
    }
    .btn-print {
      display: block;
      margin: 0 auto 1.5rem;
      padding: 0.65rem 1.5rem;
      background: #1A3E95;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>InnoVEX 2026 智匯基隆 Catch & Go</h1>
  <p class="subtitle">攤位 QR Code 列印版 — 掃描後自動開啟該廠商答題</p>
  <button type="button" class="btn-print no-print" onclick="window.print()">🖨️ 列印全部 QR Code</button>
  <div class="grid" id="qr-grid"></div>
  <script>
    const vendors = [
      { id: 1, name: '杭特電子' },
      { id: 2, name: '茁思科技' },
      { id: 3, name: '順易利' },
      { id: 4, name: '台續' },
      { id: 5, name: '智慧光' },
      { id: 6, name: '蔡技企業' },
      { id: 7, name: '佳音醫療' },
      { id: 8, name: '和平島地質公園' },
      { id: 9, name: '森田生技' },
    ];
    const base = 'https://innovvex2026-keelung-catch-go.vercel.app/?vendor=';
    const grid = document.getElementById('qr-grid');
    vendors.forEach((v) => {
      const url = base + v.id;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <p class="card__num">攤位 ${v.id}</p>
        <p class="card__name">${v.name}</p>
        <img src="assets/qr/vendor_${v.id}.png" alt="QR ${v.name}" width="160" height="160" />
        <p class="card__url">${url}</p>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
